<svg xmlns="http://www.w3.org/2000/svg" width="850" height="345" viewBox="0 0 850 345"><rect width="850" height="345" fill="white"/><rect x="20" y="30" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="145.0" y="52" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">gA：global tensor</text><text x="145.0" y="68" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">(BM, BK, K/BK)</text><rect x="300" y="30" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="425.0" y="52" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">tAg = tcA.partition_S(gA)</text><text x="425.0" y="68" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">本线程要读的元素 (V, 重复..., k)</text><rect x="580" y="30" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="705.0" y="52" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">fx.copy(atom, tAg[..., kt], rA)</text><text x="705.0" y="68" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">按重复维度循环调用 copy atom</text><rect x="20" y="150" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="145.0" y="172" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">tiled_mma</text><text x="145.0" y="188" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">atom + 排布 + 置换</text><rect x="300" y="150" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="425.0" y="172" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">tcA = make_tiled_copy_A(</text><text x="425.0" y="188" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">atom, tiled_mma).get_slice(tid)</text><rect x="580" y="150" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="705.0" y="172" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">rA = tcA.retile(fA)</text><text x="705.0" y="188" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">同一块寄存器（copy 的视角）</text><rect x="20" y="270" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="145.0" y="292" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">thr = tiled_mma.thr_slice(tid)</text><rect x="300" y="270" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="425.0" y="292" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">fA = thr.make_fragment_A(...)</text><text x="425.0" y="308" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">寄存器 tensor（MFMA 的视角）</text><rect x="580" y="270" width="250" height="56" rx="8" fill="#eef4fb" stroke="#4a6fa5"/><text x="705.0" y="292" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">fx.gemm(atom, fC, fA, fB, fC)</text><text x="705.0" y="308" font-size="11" text-anchor="middle" font-weight="normal" fill="#222" font-family="DejaVu Sans, Arial, sans-serif">按 traversal_order 调用 MFMA</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a6fa5"/></marker></defs><line x1="270.0" y1="58.0" x2="300.0" y2="58.0" stroke="#4a6fa5" stroke-width="1.5" marker-end="url(#arr)"/><line x1="550